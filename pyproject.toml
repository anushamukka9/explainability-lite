[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "explainability-lite"
version = "0.1.0"
description = "Model-agnostic local feature attributions for tabular data: permutation importance, ablation, LIME-style surrogates, SHAP-like sampling, with ASCII/Markdown/HTML reports and a CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anusha Mukka" }]
maintainers = [{ name = "Anusha Mukka" }]
keywords = ["explainability", "interpretability", "feature-attribution", "lime", "shap"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.22"]

[project.urls]
Homepage = "https://anushamukka.com"
Repository = "https://github.com/anushamukka9/explainability-lite"

[project.scripts]
explainability-lite = "explainability_lite.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/explainability_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
